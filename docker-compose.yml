# Stack « production » : frontend compilé, backend joignable uniquement via Nginx.
# Développement avec hot reload :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
x-logging: &logging
  # Logs Docker plafonnés (sinon ils grossissent sans limite sur le disque)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Lié à 127.0.0.1 : joignable depuis la machine hôte seulement
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Socket.IO partagé entre plusieurs instances du backend
  # (docker compose up -d --scale backend=2)
  redis:
    image: redis:7-alpine
    logging: *logging
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Serveur média des salons vocaux (SFU). Ports à ouvrir sur le pare-feu :
  # 7881/tcp et 50000-50100/udp. La signalisation passe par Nginx (/livekit/).
  livekit:
    image: livekit/livekit-server:v1.12.0
    logging: *logging
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-saturn}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET manquant dans .env}"
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  backend:
    build: ./backend
    logging: *logging
    restart: unless-stopped
    # Pas de port publié : tout passe par Nginx (rate limit basé sur X-Real-IP).
    # docker-compose.dev.yml le publie sur 127.0.0.1:3001 pour le développement.
    env_file:
      - .env
    environment:
      PORT: "3000"
      # Le navigateur passe par Nginx : better-auth doit connaître cette origine
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}
      REDIS_URL: redis://redis:6379
      # Salons vocaux : le navigateur passe par Nginx, le backend parle directement à LiveKit
      LIVEKIT_URL: ${PUBLIC_URL:-http://localhost}/livekit
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-saturn}
    volumes:
      # Persistance des fichiers uploadés : sans ce volume, chaque rebuild du
      # conteneur effaçait les images (URLs orphelines en base → images cassées)
      - uploads-data:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend-web:
    build:
      context: ./frontend-web
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}/api    # axios → Nginx → backend (routes NestJS)
        NEXT_PUBLIC_AUTH_URL: ${PUBLIC_URL:-http://localhost}       # better-auth → Nginx → /api/auth/*
        # Socket.IO → Nginx /socket.io/ (sans ça le client prenait "/api" pour un namespace)
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_URL:-http://localhost}
    logging: *logging
    restart: unless-stopped
    environment:
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    logging: *logging
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-web:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:
