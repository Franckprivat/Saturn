events {
  worker_connections 1024;
}

http {
  upstream backend  { server backend:3000; }
  upstream frontend { server frontend-web:3000; }

  # Journal d'accès en JSON (exploitable par un collecteur de logs)
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  # En production, passer en HTTPS : voir nginx/nginx.https.conf.example

  server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    # ── Fichiers statiques backend (uploads) ──
    location /uploads/ {
      proxy_pass         http://backend/uploads/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Better-auth (/api/auth → backend /api/auth, chemin conservé) ──
    # better-auth ne répond que sur son basePath /api/auth : réécrire en
    # /auth/* renvoyait 404 sur toutes les routes d'auth en Docker.
    location /api/auth/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API NestJS (/api/* → backend, sans le préfixe /api) ──
    location /api/ {
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket Socket.IO ──
    location /socket.io/ {
      proxy_pass         http://backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Next.js frontend (tout le reste) ──
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
