events {
  worker_connections 1024;
}

http {
  upstream backend  { server backend:3000; }
  upstream frontend { server frontend-web:3000; }

  server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    # ── Fichiers statiques backend (uploads) ──
    location /uploads/ {
      proxy_pass         http://backend/uploads/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # ── Better-auth (/api/auth → backend /auth) ──
    location /api/auth/ {
      rewrite            ^/api/auth/(.*)$ /auth/$1 break;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API NestJS (/api/* → backend, sans le préfixe /api) ──
    location /api/ {
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket Socket.IO ──
    location /socket.io/ {
      proxy_pass         http://backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Next.js frontend (tout le reste) ──
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
